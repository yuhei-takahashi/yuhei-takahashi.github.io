# ============================================================
# Yuhei Takahashi Academic Homepage
# Minimal Mistakes + GitHub Pages
# ============================================================

title: "Yuhei Takahashi"
name: "Yuhei Takahashi"
description: "Academic homepage of Yuhei Takahashi — random access, slotted ALOHA, coding theory, and wireless communications."
url: "https://yuhei-takahashi.github.io"
baseurl: ""
repository: "yuhei-takahashi/yuhei-takahashi.github.io"

# Minimal Mistakes
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

locale: "en-US"
timezone: "Asia/Tokyo"

# Site search
search: true
search_full_content: true

# Reading / layout
breadcrumbs: false
words_per_minute: 200
enable_copy_code_button: true

# Author profile
author:
  name: "Yuhei Takahashi"
  avatar: # Add "/assets/images/profile.jpg" here if you later add a photo
  bio: "Ph.D. student at Doshisha University and communication systems engineer at Hitachi, Ltd."
  location: "Japan"
  employer: "Hitachi, Ltd. / Doshisha University"
  email: "yuhei-takahashi@ieee.org"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:yuhei-takahashi@ieee.org"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yuhei-takahashi"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yuhei-takahashi"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:yuhei-takahashi@ieee.org"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

# Include standalone pages from _pages
include:
  - _pages

# Plugins supported by GitHub Pages
plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

# Markdown / Jekyll
markdown: kramdown
highlighter: rouge

# Exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
