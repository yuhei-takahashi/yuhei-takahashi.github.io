# ============================================================
# 高橋侑平 研究者ウェブサイト
# Minimal Mistakes + GitHub Pages
# ============================================================

title: "高橋 侑平"
name: "高橋 侑平"
description: "高橋侑平の研究者ウェブサイト。ランダムアクセス、Slotted ALOHA、符号理論、無線通信に関する研究を紹介しています。"
url: "https://yuhei-takahashi.github.io"
baseurl: ""
repository: "yuhei-takahashi/yuhei-takahashi.github.io"

# Minimal Mistakes
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# 日本語表示
locale: "ja-JP"
timezone: "Asia/Tokyo"

# サイト内検索
search: true
search_full_content: true

# 表示設定
breadcrumbs: false
words_per_minute: 200
enable_copy_code_button: true

# 著者プロフィール
author:
  name: "高橋 侑平"
  avatar: "/assets/images/profile.JPG"
  bio: "同志社大学大学院 博士後期課程／株式会社日立製作所 通信システムエンジニア"
  location: "日本"
  employer: "株式会社日立製作所／同志社大学"
  email: "yuhei-takahashi@ieee.org"
  links:
    - label: "メール"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:yuhei-takahashi@ieee.org"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yuhei-takahashi"

# フッター
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yuhei-takahashi"
    - label: "メール"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:yuhei-takahashi@ieee.org"

# ページのデフォルト設定
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

# 固定ページは news/index.md 等の通常の公開フォルダーに置くため、
# 旧 _pages フォルダーを公開対象から除外します。

# GitHub Pages 対応プラグイン
plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - _pages
  - HOW_TO_APPLY_JA.md
